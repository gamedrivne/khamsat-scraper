name: Khamsat Full Pipeline (Weekly)

on:
  schedule:
    # Chaque Dimanche à 22h00 UTC
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:

  # ==========================================
  # JOB 1 — RAC1 : Catégories principales
  # ==========================================
  job1-categories:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run rac1.py
      run: python rac1.py

    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add categories/
        git diff --quiet && git diff --staged --quiet || (
          git stash
          git pull --rebase origin main
          git stash pop
          git add categories/
          git commit -m "✅ [1/4] Categories - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        )

  # ==========================================
  # JOB 2 — RAC2 : Sous-catégories
  # ==========================================
  job2-sous-categories:
    runs-on: ubuntu-latest
    needs: job1-categories
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run rac2.py
      run: python rac2.py

    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add categories/
        git diff --quiet && git diff --staged --quiet || (
          git stash
          git pull --rebase origin main
          git stash pop
          git add categories/
          git commit -m "✅ [2/4] Sous-categories - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        )

  # ==========================================
  # JOB 3 — RAC3 : Services
  # ==========================================
  job3-services:
    runs-on: ubuntu-latest
    needs: job2-sous-categories
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        rm google-chrome-stable_current_amd64.deb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run rac3.py
      run: python rac3.py

    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add categories/
        git diff --quiet && git diff --staged --quiet || (
          git stash
          git pull --rebase origin main
          git stash pop
          git add categories/
          git commit -m "✅ [3/4] Services - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        )

  # ==========================================
  # JOB 4 — RAC4 : Détails
  # ==========================================
  job4-details:
    runs-on: ubuntu-latest
    needs: job3-services
    timeout-minutes: 350
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        rm google-chrome-stable_current_amd64.deb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run rac4.py
      id: scraping
      timeout-minutes: 340
      run: python rac4.py
      continue-on-error: true

    - name: Commit and push results
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add categories/
        git diff --quiet && git diff --staged --quiet || (
          git stash
          git pull --rebase origin main
          git stash pop
          git add categories/
          git commit -m "✅ [4/4] Details - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        )

    - name: Check if scraping is complete
      id: check_complete
      if: always()
      run: |
        python << 'EOF'
        import os, json, glob

        progress_dir = "categories/progress_details"
        resultats_dir = "categories/resultats"

        csv_files = glob.glob(os.path.join(resultats_dir, "Resultats_*.csv"))
        total_services = 0
        processed_services = 0

        for csv_file in csv_files:
            filename = os.path.splitext(os.path.basename(csv_file))[0]
            progress_file = os.path.join(progress_dir, f"progress_{filename}.json")

            with open(csv_file, 'r', encoding='utf-8-sig') as f:
                total_services += len(f.readlines()) - 1

            if os.path.exists(progress_file):
                with open(progress_file, 'r') as f:
                    processed_services += len(json.load(f))

        print(f"📊 Progression: {processed_services}/{total_services}")

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            if processed_services >= total_services:
                print("✅ Scraping terminé !")
                f.write("complete=true\n")
            else:
                print("🔄 Incomplet, relance nécessaire")
                f.write("complete=false\n")
        EOF

    - name: Trigger next run if incomplete
      if: steps.check_complete.outputs.complete == 'false'
      run: |
        echo "🔄 Relance automatique rac4..."
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type":"continue-details-scraping"}'

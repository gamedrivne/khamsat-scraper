name: Khamsat Full Pipeline (Monthly)

on:
  schedule:
    - cron: '0 22 15 * *'
  workflow_dispatch:
    inputs:
      reset:
        description: 'Reset complet ? (oui = nouveau cycle, non = continuer)'
        required: true
        default: 'non'
        type: choice
        options:
          - 'non'
          - 'oui'
  repository_dispatch:
    types: [continue-details-scraping]

jobs:

  # ==========================================
  # JOB 1 — RAC1 : Catégories principales
  # ==========================================
  job1-categories:
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run rac1.py
      run: python rac1.py

    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A categories/
        git diff --quiet && git diff --staged --quiet || (
          git commit -m "✅ [1/4] Categories - $(date +'%Y-%m-%d %H:%M:%S')"
          git pull origin main --rebase --autostash
          git push
        )

    - name: 📊 Trigger Dashboard
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type":"trigger-dashboard"}'

  # ==========================================
  # JOB 2 — RAC2 : Sous-catégories
  # ==========================================
  job2-sous-categories:
    runs-on: ubuntu-latest
    needs: job1-categories
    if: github.event_name != 'repository_dispatch'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run rac2.py
      run: python rac2.py

    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A categories/
        git diff --quiet && git diff --staged --quiet || (
          git commit -m "✅ [2/4] Sous-categories - $(date +'%Y-%m-%d %H:%M:%S')"
          git pull origin main --rebase --autostash
          git push
        )

    - name: 📊 Trigger Dashboard
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type":"trigger-dashboard"}'

  # ==========================================
  # JOB 3 — RAC3 : Services
  # ==========================================
  job3-services:
    runs-on: ubuntu-latest
    needs: job2-sous-categories
    if: github.event_name != 'repository_dispatch'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        rm google-chrome-stable_current_amd64.deb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run rac3.py
      run: python rac3.py

    - name: Commit and push results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A categories/
        git diff --quiet && git diff --staged --quiet || (
          git commit -m "✅ [3/4] Services - $(date +'%Y-%m-%d %H:%M:%S')"
          git pull origin main --rebase --autostash
          git push
        )

    - name: 📊 Trigger Dashboard
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type":"trigger-dashboard"}'

  # ==========================================
  # JOB 4 — RAC4 : Détails
  # ==========================================
  job4-details:
    runs-on: ubuntu-latest
    needs: [job1-categories, job2-sous-categories, job3-services]
    if: always()
    timeout-minutes: 350
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: 🗑️ Reset complet (nouveau cycle schedule)
      if: github.event_name == 'schedule'
      run: |
        echo "🗑️ Reset automatique cycle mensuel..."
        rm -rf categories/progress_details/
        rm -rf categories/details_services/
        mkdir -p categories/progress_details/
        mkdir -p categories/details_services/
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A categories/
        git diff --quiet && git diff --staged --quiet || (
          git commit -m "🗑️ Reset nouveau cycle - $(date +'%Y-%m-%d %H:%M:%S')"
          git pull origin main --rebase --autostash
          git push
        )
        echo "✅ Reset complet effectué"

    - name: 🗑️ Reset complet (manuel avec oui)
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.reset == 'oui'
      run: |
        echo "🗑️ Reset manuel demandé..."
        rm -rf categories/progress_details/
        rm -rf categories/details_services/
        mkdir -p categories/progress_details/
        mkdir -p categories/details_services/
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A categories/
        git diff --quiet && git diff --staged --quiet || (
          git commit -m "🗑️ Reset manuel - $(date +'%Y-%m-%d %H:%M:%S')"
          git pull origin main --rebase --autostash
          git push
        )
        echo "✅ Reset manuel effectué"

    - name: 🔄 Reprise (manuel non ou relance auto)
      if: |
        github.event_name == 'repository_dispatch' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.reset == 'non')
      run: |
        echo "🔄 Reprise depuis la progression existante..."
        mkdir -p categories/progress_details/
        mkdir -p categories/details_services/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
        rm google-chrome-stable_current_amd64.deb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run rac4.py
      id: scraping
      timeout-minutes: 340
      run: python rac4.py
      continue-on-error: true

    - name: Commit and push results
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A categories/
        git diff --quiet && git diff --staged --quiet || (
          git commit -m "🔄 [4/4] Details - $(date +'%Y-%m-%d %H:%M:%S')"
          git pull origin main --rebase --autostash
          git push
        )

    - name: Check if scraping is complete
      id: check_complete
      if: always()
      run: |
        python << 'EOF'
        import os, json, glob

        progress_dir  = "categories/progress_details"
        resultats_dir = "categories/resultats"

        csv_files = glob.glob(os.path.join(resultats_dir, "Resultats_*.csv"))
        total_services     = 0
        processed_services = 0

        for csv_file in csv_files:
            filename      = os.path.splitext(os.path.basename(csv_file))[0]
            progress_file = os.path.join(progress_dir, f"progress_{filename}.json")

            with open(csv_file, 'r', encoding='utf-8-sig') as f:
                total_services += len(f.readlines()) - 1

            if os.path.exists(progress_file):
                with open(progress_file, 'r') as f:
                    processed_services += len(json.load(f))

        print(f"📊 Progression: {processed_services}/{total_services}")

        with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            if processed_services >= total_services:
                print("✅ Scraping terminé !")
                f.write("complete=true\n")
            else:
                print("🔄 Incomplet, relance nécessaire")
                f.write("complete=false\n")
        EOF

    - name: 📊 Trigger Dashboard
      if: always()
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type":"trigger-dashboard"}'

    - name: Trigger next run if incomplete
      if: steps.check_complete.outputs.complete == 'false'
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type":"continue-details-scraping"}'

    - name: ✅ Rapport final
      if: steps.check_complete.outputs.complete == 'true'
      run: |
        echo "=========================================="
        echo "✅ PIPELINE COMPLET - CYCLE TERMINÉ"
        echo "Prochain cycle : 15 du mois suivant à 22h UTC"
        echo "=========================================="

    - name: 🔔 Trigger Dashboard final
      if: steps.check_complete.outputs.complete == 'true'
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type":"update-dashboard"}'

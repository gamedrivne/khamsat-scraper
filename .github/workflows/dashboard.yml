name: Dashboard Update

on:
  # Déclenché par le pipeline principal (en cours + terminé)
  workflow_run:
    workflows: ["Khamsat Full Pipeline (Monthly)"]
    types: [in_progress, completed]

  # Déclenché par les relances automatiques rac4
  repository_dispatch:
    types: [continue-details-scraping, update-dashboard]

  # Lancement manuel possible
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generate dashboard
      run: python dashboard.py

    - name: Commit and push dashboard
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add DASHBOARD.md
        git diff --quiet && git diff --staged --quiet || (
          git stash
          git pull --rebase origin main
          git stash pop
          git add DASHBOARD.md
          git commit -m "📊 Dashboard update - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        )
